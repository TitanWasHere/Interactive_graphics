<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Pixelato con Three.js</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { RenderPixelatedPass } from 'three/addons/postprocessing/RenderPixelatedPass.js';

        // --- Configurazione Generale ---
        const GRID_SIZE = 10; // Una griglia più grande per il dungeon
        const BLOCK_SIZE = 1; // Dimensione di un singolo blocco di terreno/parete
        const PIXEL_SIZE = 1; // Dimensione dei pixel per RenderPixelatedPass

        let scene, camera, renderer, composer, controls;

        // --- Colori per Dungeon ---
        const Colors = {
            // Terreno/Parete
            dungeonFloor: 0x4A4A4A,    // Grigio scuro per pavimento/pareti
            dungeonWall: 0x3A3A3A,     // Grigio ancora più scuro
            stoneDetail: 0x555555,     // Grigio chiaro per dettagli pietra

            // Legno
            woodDark: 0x6F4F28,       // Marrone scuro
            woodLight: 0x8B633F,      // Marrone chiaro

            // Metallo
            metal: 0x505050,          // Grigio metallo scuro
            metalHighlight: 0x707070, // Grigio metallo chiaro

            // Fuoco/Luce Magica
            fireEmissive: 0xFF8C00,   // Arancione fuoco
            crystalEmissive: 0x8A2BE2, // Viola per cristalli magici

            // Oro/Tesoro
            gold: 0xFFD700,           // Oro

            // Sangue/Ruggine
            bloodRed: 0x8B0000,       // Rosso sangue

            // Luci Globali
            light: 0xFFFFFF,
            ambient: 0xffffff        // Luce ambientale più scura per dungeon
        };

        // --- Helper functions e unità di misura (SPOSTATI QUI) ---
        const unit = 0.5; // Unità di misura base per gli oggetti

        // Helper per creare un cubo
        const addCube = (w, h, d, x, y, z, material, group) => {
            const geometry = new THREE.BoxGeometry(w * unit, h * unit, d * unit);
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x * unit, y * unit, z * unit);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            group.add(mesh);
            return mesh;
        };

        // Helper per creare un cilindro (utile per pilastri, barili, fiamme)
        const addCylinder = (radiusTop, radiusBottom, height, radialSegments, x, y, z, material, group) => {
            const geometry = new THREE.CylinderGeometry(radiusTop * unit, radiusBottom * unit, height * unit, radialSegments);
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x * unit, y * unit, z * unit);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            group.add(mesh);
            return mesh;
        };

        // Helper per creare un icosaedro (utile per rocce, cristalli, fiamme spigolose)
        const addIcosahedron = (radius, detail, x, y, z, material, group) => {
            const geometry = new THREE.IcosahedronGeometry(radius * unit, detail); // detail=0 per look pixelato
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x * unit, y * unit, z * unit);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            group.add(mesh);
            return mesh;
        };
        // --- Fine Helper functions e unità di misura ---


        init();
        animate();

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x202020); // Sfondo molto scuro

            // Camera (Orthographic per visuale isometrica)
            const aspectRatio = window.innerWidth / window.innerHeight;
            const frustumSize = GRID_SIZE * BLOCK_SIZE * 1.5;
            camera = new THREE.OrthographicCamera(
                -frustumSize * aspectRatio / 2,
                frustumSize * aspectRatio / 2,
                frustumSize / 2,
                -frustumSize / 2,
                0.1,
                1000
            );
            camera.position.set(GRID_SIZE * BLOCK_SIZE, GRID_SIZE * BLOCK_SIZE * 0.8, GRID_SIZE * BLOCK_SIZE);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Luci Globali
            const ambientLight = new THREE.AmbientLight(Colors.ambient, 1); // Meno luce ambientale
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(Colors.light, 0.7); // Meno luce direzionale
            directionalLight.position.set(20, 30, 20);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 100;
            directionalLight.shadow.camera.left = -15;
            directionalLight.shadow.camera.right = 15;
            directionalLight.shadow.camera.top = 15;
            directionalLight.shadow.camera.bottom = -15;
            scene.add(directionalLight);

            // Controlli
            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 0, 0);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false;
            controls.minDistance = 1;
            controls.maxDistance = 50;
            controls.maxPolarAngle = Math.PI / 2 - 0.1;
            controls.enablePan = true;

            // Creazione del pavimento del dungeon
            createDungeonFloor(GRID_SIZE, BLOCK_SIZE);

            // Aggiungi gli oggetti del dungeon
            addDungeonObjectsToScene();

            // Post-processing per l'effetto pixel
            composer = new EffectComposer(renderer);
            composer.addPass(new RenderPass(scene, camera));
            composer.addPass(new RenderPixelatedPass(PIXEL_SIZE, scene, camera));

            // Gestione del ridimensionamento della finestra
            window.addEventListener('resize', onWindowResize, false);
        }

        // Funzione per creare il pavimento del dungeon
        function createDungeonFloor(gridSize, blockSize) {
            const startX = -(gridSize * blockSize) / 2 + blockSize / 2;
            const startZ = -(gridSize * blockSize) / 2 + blockSize / 2;

            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    const x = startX + i * blockSize;
                    const z = startZ + j * blockSize;

                    const floorGeometry = new THREE.BoxGeometry(blockSize, blockSize, blockSize);
                    const floorMaterial = new THREE.MeshStandardMaterial({ color: Colors.dungeonFloor });
                    const floorBlock = new THREE.Mesh(floorGeometry, floorMaterial);
                    floorBlock.position.set(x, 0, z);
                    floorBlock.castShadow = false;
                    floorBlock.receiveShadow = true;
                    scene.add(floorBlock);

                    // Aggiungi un blocco più scuro sotto per l'effetto "bordo"
                    const subFloorGeometry = new THREE.BoxGeometry(blockSize, blockSize, blockSize);
                    const subFloorMaterial = new THREE.MeshStandardMaterial({ color: Colors.dungeonWall });
                    const subFloorBlock = new THREE.Mesh(subFloorGeometry, subFloorMaterial);
                    subFloorBlock.position.set(x, -blockSize, z);
                    subFloorBlock.castShadow = false;
                    subFloorBlock.receiveShadow = true;
                    scene.add(subFloorBlock);
                }
            }
        }

        /**
         * Funzione per aggiungere tutti gli oggetti del dungeon alla scena.
         * Puoi modificare le posizioni per creare il tuo layout di dungeon.
         */
        function addDungeonObjectsToScene() {
            const getRealCoords = (gridX, gridZ, yOffset = 0) => {
                const startX = -(GRID_SIZE * BLOCK_SIZE) / 2;
                const startZ = -(GRID_SIZE * BLOCK_SIZE) / 2;
                return {
                    x: startX + gridX * BLOCK_SIZE + BLOCK_SIZE / 2,
                    y: yOffset,
                    z: startZ + gridZ * BLOCK_SIZE + BLOCK_SIZE / 2
                };
            };

            // Esempio di posizionamento degli oggetti
            let pos;

            pos = getRealCoords(1, 1, BLOCK_SIZE / 2);
            scene.add(createPillar(pos.x, pos.y, pos.z));

            pos = getRealCoords(3, 2, BLOCK_SIZE / 2);
            scene.add(createTreasureChest(pos.x, pos.y, pos.z));

            pos = getRealCoords(6, 1, BLOCK_SIZE / 2);
            scene.add(createTorch(pos.x, pos.y, pos.z));

            pos = getRealCoords(5, 5, BLOCK_SIZE / 2);
            scene.add(createAltar(pos.x, pos.y, pos.z));

            pos = getRealCoords(2, 7, BLOCK_SIZE / 2);
            scene.add(createBarrel(pos.x, pos.y, pos.z));

            pos = getRealCoords(3, 7, BLOCK_SIZE / 2);
            scene.add(createCrate(pos.x, pos.y, pos.z));

            pos = getRealCoords(8, 8, BLOCK_SIZE / 2);
            scene.add(createSpikes(pos.x, pos.y, pos.z));

            pos = getRealCoords(8, 7, BLOCK_SIZE / 2);
            scene.add(createSpikes(pos.x, pos.y, pos.z));

            pos = getRealCoords(7, 8, BLOCK_SIZE / 2);
            scene.add(createSpikes(pos.x, pos.y, pos.z));

        }

        // --- Funzioni per creare gli oggetti del Dungeon (possono rimanere qui, dopo gli helper) ---

        /**
         * Crea un Pilastro del Dungeon.
         */
        function createPillar(x, y, z) {
            const pillarGroup = new THREE.Group();
            pillarGroup.position.set(x, y, z); // Posizione del gruppo

            // Base del pilastro
            addCube(1.5, 0.5, 1.5, 0, 0.25, 0, new THREE.MeshStandardMaterial({ color: Colors.dungeonWall }), pillarGroup);

            // Corpo del pilastro (cilindro con pochi segmenti per look blocky)
            addCylinder(0.8, 0.8, 4, 8, 0, 2.5, 0, new THREE.MeshStandardMaterial({ color: Colors.dungeonFloor }), pillarGroup);

            // Capitello (cima del pilastro)
            addCube(1.5, 0.5, 1.5, 0, 4.75, 0, new THREE.MeshStandardMaterial({ color: Colors.dungeonWall }), pillarGroup);

            return pillarGroup;
        }

        /**
         * Crea una Cassa del Tesoro.
         */
        function createTreasureChest(x, y, z) {
            const chestGroup = new THREE.Group();
            chestGroup.position.set(x, y, z);

            // Base della cassa
            addCube(1.5, 1.0, 1.0, 0, 0.5, 0, new THREE.MeshStandardMaterial({ color: Colors.woodDark }), chestGroup);

            // Coperchio della cassa (leggermente arretrato per l'apertura)
            const lid = addCube(1.6, 0.3, 1.1, 0, 1.15, -0.05, new THREE.MeshStandardMaterial({ color: Colors.woodLight }), chestGroup);
            lid.rotation.x = -Math.PI / 10; // Leggermente aperto

            // Dettagli metallici (serratura, cerniere)
            addCube(0.2, 0.2, 0.1, 0, 0.9, 0.5, new THREE.MeshStandardMaterial({ color: Colors.metal }), chestGroup); // Serratura
            addCube(0.2, 0.2, 0.1, 0.7, 0.9, 0.5, new THREE.MeshStandardMaterial({ color: Colors.metal }), chestGroup); // Cardine 1
            addCube(0.2, 0.2, 0.1, -0.7, 0.9, 0.5, new THREE.MeshStandardMaterial({ color: Colors.metal }), chestGroup); // Cardine 2

            // Tesoro all'interno (cubi d'oro)
            addCube(0.3, 0.3, 0.3, 0.2, 0.7, 0.1, new THREE.MeshStandardMaterial({ color: Colors.gold }), chestGroup);
            addCube(0.2, 0.2, 0.2, -0.3, 0.6, -0.1, new THREE.MeshStandardMaterial({ color: Colors.gold }), chestGroup);

            return chestGroup;
        }

        /**
         * Crea una Torcia.
         */
        function createTorch(x, y, z) {
            const torchGroup = new THREE.Group();
            torchGroup.position.set(x, y, z);

            // Bastone della torcia
            addCylinder(0.15, 0.15, 2, 6, 0, 1.0, 0, new THREE.MeshStandardMaterial({ color: Colors.woodDark }), torchGroup);

            // Supporto metallico
            addCube(0.4, 0.4, 0.4, 0, 2.1, 0, new THREE.MeshStandardMaterial({ color: Colors.metal }), torchGroup);

            // Fiamma (icosaedro con detail 0 e luce emissiva)
            const flame = addIcosahedron(0.4, 0, 0, 2.5, 0, new THREE.MeshStandardMaterial({ color: Colors.fireEmissive, emissive: Colors.fireEmissive, emissiveIntensity: 1.0 }), torchGroup);

            // Luce puntiforme effettiva della torcia
            const pointLight = new THREE.PointLight(Colors.fireEmissive, 5, 5); // Colore, intensità, distanza
            pointLight.position.set(flame.position.x * unit, flame.position.y * unit + 0.1, flame.position.z * unit);
            torchGroup.add(pointLight);

            return torchGroup;
        }

        /**
         * Crea un Altare/Piattaforma rituale.
         */
        function createAltar(x, y, z) {
            const altarGroup = new THREE.Group();
            altarGroup.position.set(x, y, z);

            // Base dell'altare
            addCube(2.5, 0.8, 2.5, 0, 0.4, 0, new THREE.MeshStandardMaterial({ color: Colors.dungeonFloor }), altarGroup);

            // Colonna centrale
            addCube(1.5, 1.0, 1.5, 0, 1.3, 0, new THREE.MeshStandardMaterial({ color: Colors.dungeonWall }), altarGroup);

            // Parte superiore piatta
            addCube(2.0, 0.4, 2.0, 0, 2.0, 0, new THREE.MeshStandardMaterial({ color: Colors.dungeonFloor }), altarGroup);

            // Cristallo magico sulla cima
            addIcosahedron(0.6, 0, 0, 2.5, 0, new THREE.MeshStandardMaterial({ color: Colors.crystalEmissive, emissive: Colors.crystalEmissive, emissiveIntensity: 0.8 }), altarGroup);
            // Aggiungi una luce puntiforme per il cristallo
            const crystalLight = new THREE.PointLight(Colors.crystalEmissive, 3, 3);
            crystalLight.position.set(0, 2.5 * unit + 0.1, 0);
            altarGroup.add(crystalLight);

            return altarGroup;
        }

        /**
         * Crea un Barile.
         */
        function createBarrel(x, y, z) {
            const barrelGroup = new THREE.Group();
            barrelGroup.position.set(x, y, z);

            // Corpo del barile
            addCylinder(0.8, 0.8, 1.2, 8, 0, 0.6, 0, new THREE.MeshStandardMaterial({ color: Colors.woodLight }), barrelGroup);

            // Cerchi metallici
            addCylinder(0.85, 0.85, 0.1, 8, 0, 0.1, 0, new THREE.MeshStandardMaterial({ color: Colors.metal }), barrelGroup); // Basso
            addCylinder(0.85, 0.85, 0.1, 8, 0, 1.1, 0, new THREE.MeshStandardMaterial({ color: Colors.metal }), barrelGroup); // Alto

            return barrelGroup;
        }

        /**
         * Crea una Cassa di Legno.
         */
        function createCrate(x, y, z) {
            const crateGroup = new THREE.Group();
            crateGroup.position.set(x, y, z);

            // Corpo della cassa
            addCube(1.2, 1.2, 1.2, 0, 0.6, 0, new THREE.MeshStandardMaterial({ color: Colors.woodDark }), crateGroup);

            // Dettagli delle assi (cubi piatti)
            addCube(1.25, 0.1, 1.25, 0, 1.15, 0, new THREE.MeshStandardMaterial({ color: Colors.woodLight }), crateGroup); // Sopra
            addCube(1.25, 0.1, 1.25, 0, 0.05, 0, new THREE.MeshStandardMaterial({ color: Colors.woodLight }), crateGroup); // Sotto
            addCube(1.25, 1.25, 0.1, 0, 0.6, 0.625, new THREE.MeshStandardMaterial({ color: Colors.woodLight }), crateGroup); // Frontale
            addCube(1.25, 1.25, 0.1, 0, 0.6, -0.625, new THREE.MeshStandardMaterial({ color: Colors.woodLight }), crateGroup); // Posteriore

            return crateGroup;
        }

        /**
         * Crea una Trappola a Spuntoni.
         */
        function createSpikes(x, y, z) {
            const spikesGroup = new THREE.Group();
            spikesGroup.position.set(x, y, z);

            // Base degli spuntoni
            addCube(1.0, 0.1, 1.0, 0, 0.05, 0, new THREE.MeshStandardMaterial({ color: Colors.metal }), spikesGroup);

            // Spuntoni (coni con pochi segmenti per look pixelato)
            const spikeMaterial = new THREE.MeshStandardMaterial({ color: Colors.metalHighlight });
            addCylinder(0, 0.3, 0.8, 4, -0.3, 0.45, -0.3, spikeMaterial, spikesGroup);
            addCylinder(0, 0.3, 0.8, 4, 0.3, 0.45, -0.3, spikeMaterial, spikesGroup);
            addCylinder(0, 0.3, 0.8, 4, -0.3, 0.45, 0.3, spikeMaterial, spikesGroup);
            addCylinder(0, 0.3, 0.8, 4, 0.3, 0.45, 0.3, spikeMaterial, spikesGroup);
            addCylinder(0, 0.3, 0.8, 4, 0, 0.45, 0, spikeMaterial, spikesGroup); // Centrale

            return spikesGroup;
        }


        // --- Loop di animazione ---
        function animate() {
            requestAnimationFrame(animate);

            controls.update();

            composer.render();
        }

        // --- Gestione ridimensionamento finestra ---
        function onWindowResize() {
            const aspectRatio = window.innerWidth / window.innerHeight;
            const frustumSize = GRID_SIZE * BLOCK_SIZE * 1.5;
            camera.left = -frustumSize * aspectRatio / 2;
            camera.right = frustumSize * aspectRatio / 2;
            camera.top = frustumSize / 2;
            camera.bottom = -frustumSize / 2;
            camera.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
